server {
    if ($host = sucaiyigou.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = open.sucaiyigou.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.sucaiyigou.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name open.sucaiyigou.cn sucaiyigou.cn www.sucaiyigou.cn;
    return 301 https://$server_name$request_uri;






}

server {
    listen 443 ssl;
    server_name open.sucaiyigou.cn sucaiyigou.cn www.sucaiyigou.cn;
    ssl_certificate /etc/letsencrypt/live/open.sucaiyigou.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/open.sucaiyigou.cn/privkey.pem; # managed by Certbot

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }





}

{% extends "admin/base_admin.html" %}
{% block admin_content %}
<h2 style="margin-bottom:24px;">控制台</h2>
<div class="admin-stats">
  <div class="stat-card"><div class="num">{{ stats.articles }}</div><div>文章总数</div></div>
  <div class="stat-card"><div class="num">{{ stats.cases }}</div><div>案例总数</div></div>
  <div class="stat-card"><div class="num">{{ stats.assessments }}</div><div>评估记录</div></div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px;">
  <div class="card" style="padding:20px;">
    <h3 style="margin-bottom:12px;">快捷操作</h3>
    <button class="btn btn-primary" onclick="scrapeNow()" style="margin-bottom:8px;">立即抓取文章</button>
    <a href="/admin/articles" class="btn btn-outline" style="display:block;margin-bottom:8px;">管理文章</a>
    <a href="/admin/cases" class="btn btn-outline" style="display:block;margin-bottom:8px;">管理案例</a>
    <a href="/admin/announcements" class="btn btn-outline" style="display:block;">管理公告</a>
  </div>
  <div class="card" style="padding:20px;">
    <h3 style="margin-bottom:12px;">系统信息</h3>
    <p style="font-size:13px;color:var(--text-secondary);">数据库: SQLite</p>
    <p style="font-size:13px;color:var(--text-secondary);">服务器: Flask</p>
    <p style="font-size:13px;color:var(--text-secondary);">抓取源: 华为云/腾讯研究院/第一财经</p>
  </div>
</div>

<script>
async function scrapeNow() {
  const btn = event.target;
  btn.disabled = true; btn.textContent = '抓取中...';
  const r = await fetch('/admin/scrape', {method:'POST', headers:{'X-CSRF-Token':'{{ csrf_token() }}'}});
  const d = await r.json();
  alert(d.success ? `成功添加 ${d.count} 篇文章` : `失败: ${d.error}`);
  btn.disabled = false; btn.textContent = '立即抓取文章';
  if(d.success) location.reload();
}
</script>
{% endblock %}

{% extends "admin/base_admin.html" %}
{% block admin_content %}
<h2 style="margin-bottom:24px;">案例管理 ({{ cases|length }})</h2>
<table>
<thead><tr><th>ID</th><th>标题</th><th>行业</th><th>规模</th><th>标签</th><th>操作</th></tr></thead>
<tbody>
{% for c in cases %}
<tr>
  <td>{{ c.id }}</td><td>{{ c.title }}</td><td>{{ c.industry }}</td><td>{{ c.scale }}</td>
  <td>{% for t in (c.tags or '').split(',')[:2] %}<span class="tag">{{ t.strip() }}</span>{% endfor %}</td>
  <td><a href="/admin/case/{{ c.id }}" class="btn btn-outline btn-sm">编辑</a></td>
</tr>
{% endfor %}
</tbody></table>
<a href="/admin/case/new" class="btn btn-primary" style="margin-top:16px;">新建案例</a>
{% endblock %}

{% extends "admin/base_admin.html" %}
{% block admin_content %}
<h2>{% if asset %}编辑单位B资产 #{{ asset.id }}{% else %}新增单位B资产{% endif %}</h2>
<form method="POST" style="max-width:500px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label>资产编码 *</label>
    <select name="asset_code_id" required>
      <option value="">-- 请选择资产 --</option>
      <optgroup label="桌子">
        {% for c in codes if c.category == 'table' %}
        <option value="{{ c.id }}" {% if asset and asset.asset_code_id == c.id %}selected{% endif %}>{{ c.code }} - {{ c.name }}</option>
        {% endfor %}
      </optgroup>
      <optgroup label="椅子">
        {% for c in codes if c.category == 'chair' %}
        <option value="{{ c.id }}" {% if asset and asset.asset_code_id == c.id %}selected{% endif %}>{{ c.code }} - {{ c.name }}</option>
        {% endfor %}
      </optgroup>
    </select>
  </div>
  <div class="form-group">
    <label>数量</label>
    <input name="quantity" type="number" value="{{ asset.quantity if asset else 1 }}" min="1" required>
  </div>
  <div class="form-group">
    <label>备注</label>
    <input name="remark" value="{{ asset.remark if asset else '' }}" placeholder="可选备注">
  </div>
  <div style="display:flex;gap:12px;">
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="/admin/assets/unit-b" class="btn btn-outline">返回</a>
  </div>
</form>
{% endblock %}

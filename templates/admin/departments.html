{% extends "admin/base_admin.html" %}
{% block admin_content %}
<h1>科室管理 ({{ departments|length }})</h1>
<div style="margin-bottom:16px;display:flex;gap:12px;">
  <a href="/admin/assets/departments/new" class="btn btn-primary">+ 新增科室</a>
  <a href="/admin/assets/unit-a" class="btn btn-outline">单位A资产管理</a>
  <a href="/admin/assets" class="btn btn-outline">← 返回仪表盘</a>
</div>
<table>
<thead><tr><th>ID</th><th>科室名称</th><th>排序</th><th>操作</th></tr></thead>
<tbody>
{% for d in departments %}
<tr>
  <td>{{ d.id }}</td>
  <td><strong>{{ d.name }}</strong></td>
  <td>{{ d.sort_order }}</td>
  <td><a href="/admin/assets/departments/{{ d.id }}" class="btn btn-outline btn-sm">编辑</a></td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}

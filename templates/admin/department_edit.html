{% extends "admin/base_admin.html" %}
{% block admin_content %}
<h2>{% if department %}编辑科室 #{{ department.id }}{% else %}新增科室{% endif %}</h2>
<form method="POST" style="max-width:400px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label>科室名称 *</label>
    <input name="name" value="{{ department.name if department else '' }}" required placeholder="如 财务科">
  </div>
  <div class="form-group">
    <label>排序</label>
    <input name="sort_order" type="number" value="{{ department.sort_order if department else 0 }}">
  </div>
  <div style="display:flex;gap:12px;">
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="/admin/assets/departments" class="btn btn-outline">返回</a>
  </div>
</form>
{% endblock %}

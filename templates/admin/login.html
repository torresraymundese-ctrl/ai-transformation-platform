<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台登录 - 企业AI转型平台</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
    .login-card{width:min(92vw,400px);padding:32px;background:#fff;border:1px solid #d2d2d7;border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.08)}
    h1{font-size:24px;margin:0 0 8px}.hint{margin:0 0 24px;color:#6e6e73;font-size:14px}.field{margin-bottom:16px}.field label{display:block;margin-bottom:6px;font-weight:600;font-size:13px}.field input{width:100%;padding:11px 12px;border:1px solid #d2d2d7;border-radius:8px;font:inherit}.field input:focus{outline:3px solid rgba(0,113,227,.18);border-color:#0071e3}.error{padding:10px 12px;margin-bottom:16px;border-radius:8px;background:#fff1f0;color:#b42318;font-size:13px}.submit{width:100%;padding:12px;border:0;border-radius:8px;background:#0071e3;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="login-card">
    <h1>后台安全登录</h1>
    <p class="hint">请输入服务器环境中配置的管理员凭据。</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="POST" action="/admin/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="submit" type="submit">登录</button>
    </form>
  </main>
</body>
</html>

{% extends "admin/base_admin.html" %}
{% block admin_content %}
<h1>{% if asset %}编辑单位A资产 #{{ asset.id }}{% else %}新增单位A资产{% endif %}</h1>
<form method="POST" style="max-width:500px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label for="unit-a-department">科室 *</label>
    <select id="unit-a-department" name="department" required>
      <option value="">-- 请选择科室 --</option>
      {% for d in departments %}
      <option value="{{ d.name }}" {% if asset and asset.department == d.name %}selected{% endif %}>{{ d.name }}</option>
      {% endfor %}
    </select>
    <small style="color:var(--text-secondary);">如果列表为空，请先在<a href="/admin/assets/departments">科室管理</a>中添加</small>
  </div>
  <div class="form-group">
    <label for="unit-a-asset-code">资产编码 *</label>
    <select id="unit-a-asset-code" name="asset_code_id" required>
      <option value="">-- 请选择资产 --</option>
      <optgroup label="桌子">
        {% for c in codes if c.category == 'table' %}
        <option value="{{ c.id }}" {% if asset and asset.asset_code_id == c.id %}selected{% endif %}>{{ c.code }} - {{ c.name }}</option>
        {% endfor %}
      </optgroup>
      <optgroup label="椅子">
        {% for c in codes if c.category == 'chair' %}
        <option value="{{ c.id }}" {% if asset and asset.asset_code_id == c.id %}selected{% endif %}>{{ c.code }} - {{ c.name }}</option>
        {% endfor %}
      </optgroup>
    </select>
  </div>
  <div class="form-group">
    <label for="unit-a-quantity">数量</label>
    <input id="unit-a-quantity" name="quantity" type="number" value="{{ asset.quantity if asset else 1 }}" min="1" required>
  </div>
  <div class="form-group">
    <label for="unit-a-remark">备注</label>
    <input id="unit-a-remark" name="remark" value="{{ asset.remark if asset else '' }}" placeholder="可选的备注信息">
  </div>
  <div style="display:flex;gap:12px;">
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="/admin/assets/unit-a" class="btn btn-outline">返回</a>
  </div>
</form>
{% endblock %}

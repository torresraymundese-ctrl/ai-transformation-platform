{% extends "admin/base_admin.html" %}
{% block admin_content %}
<h2>{% if code %}编辑编码 #{{ code.id }}{% else %}新增编码{% endif %}</h2>
<form method="POST" style="max-width:500px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label>编码 *</label>
    <input name="code" value="{{ code.code if code else '' }}" required placeholder="如 Z001, Y001">
  </div>
  <div class="form-group">
    <label>名称 *</label>
    <input name="name" value="{{ code.name if code else '' }}" required placeholder="如 办公桌-标准型">
  </div>
  <div class="form-group">
    <label>类别 *</label>
    <select name="category" required>
      <option value="table" {% if code and code.category == 'table' %}selected{% endif %}>桌子</option>
      <option value="chair" {% if code and code.category == 'chair' %}selected{% endif %}>椅子</option>
    </select>
  </div>
  <div class="form-group">
    <label>排序</label>
    <input name="sort_order" type="number" value="{{ code.sort_order if code else 0 }}">
  </div>
  <div style="display:flex;gap:12px;">
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="/admin/assets/codes" class="btn btn-outline">返回</a>
  </div>
</form>
{% endblock %}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CMS后台 - 企业AI转型平台{% endblock %}</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-admin-shell="true">
<a class="skip-link" href="#admin-main">跳到后台主要内容</a>
<div class="admin-layout">
{% block admin_navigation %}{% include "components/admin_navigation.html" %}{% endblock %}
<main class="admin-main" id="admin-main" tabindex="-1" aria-label="后台主要内容">
{% block admin_content %}{% endblock %}
</main>
</div>
<script src="{{ url_for('static', filename='js/admin_ui.js') }}" defer></script>
</body>
</html>

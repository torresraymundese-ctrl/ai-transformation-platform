<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS后台 - 企业AI转型平台</title>
<style>
:root{--primary:#0071e3;--primary-dark:#0066cc;--accent:#bf4800;--bg:#f5f5f7;--text:#1d1d1f;--text-secondary:#86868b;--border:#d2d2d7;--radius:10px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
.admin-nav{background:#1d1d1f;color:#fff;padding:0 24px;display:flex;align-items:center;height:50px;gap:24px;}
.admin-nav a{color:#9CA3AF;text-decoration:none;font-size:13px;}
.admin-nav a:hover,.admin-nav a.active{color:#fff;}
.admin-nav .brand{font-weight:700;color:#fff;margin-right:auto;}
.admin-wrap{display:flex;min-height:calc(100vh - 50px);}
.admin-sidebar{width:200px;background:#fff;border-right:1px solid var(--border);padding:20px 0;}
.admin-sidebar a{display:block;padding:10px 24px;color:var(--text-secondary);text-decoration:none;font-size:13px;transition:all 0.2s;}
.admin-sidebar a:hover,.admin-sidebar a.active{background:#e8f4fd;color:var(--primary);border-right:3px solid var(--primary);}
.admin-main{flex:1;padding:24px;}
.card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);}
.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.stat-card{background:#fff;border-radius:var(--radius);padding:20px;text-align:center;border:1px solid var(--border);}
.stat-card .num{font-size:28px;font-weight:800;color:var(--primary);}
.btn{display:inline-block;padding:8px 18px;border-radius:6px;font-size:13px;cursor:pointer;border:none;text-decoration:none;font-weight:600;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}
.btn-danger{background:#DC2626;color:#fff;}
.btn-sm{padding:4px 12px;font-size:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#f5f5f7;padding:10px 12px;text-align:left;font-weight:600;border-bottom:2px solid var(--border);}
td{padding:8px 12px;border-bottom:1px solid var(--border);}
tr:hover td{background:#FAFBFC;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-weight:600;margin-bottom:4px;font-size:13px;}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;}
.form-group textarea{min-height:120px;resize:vertical;}
.flash{background:#e8f4fd;border:1px solid var(--primary);padding:12px 16px;border-radius:var(--radius);margin-bottom:16px;color:var(--primary);}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#e8f4fd;color:var(--primary);margin:2px;}
</style>
</head>
<body>
{% include "components/admin_navigation.html" %}
<div class="admin-main">
{% block admin_content %}{% endblock %}
</div>
</body>
</html>

{% extends "admin/base_admin.html" %}
{% block admin_content %}
<p><a href="/admin/ingestion">← 返回候选列表</a></p>
<div class="card" style="padding:24px;margin-top:16px;">
  <p style="color:var(--text-secondary);">候选 #{{ candidate.id }} · {{ candidate.source_name }}</p>
  <h2>{{ candidate.title }}</h2>
  <p>{{ candidate.licensed_summary }}</p>
  <p><strong>状态：</strong>{{ candidate.state }}</p>
  {% if candidate.state == 'pending_review' %}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px;">
    <form method="post" action="/admin/ingestion/{{ candidate.id }}/decision">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="accept">
      <input type="hidden" name="expected_lock_version" value="{{ candidate.lock_version }}">
      <label for="slug">资源别名</label>
      <input id="slug" name="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" maxlength="120">
      <button class="btn btn-primary" type="submit">接受为资源草稿</button>
    </form>
    <form method="post" action="/admin/ingestion/{{ candidate.id }}/decision">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="reject">
      <input type="hidden" name="expected_lock_version" value="{{ candidate.lock_version }}">
      <label for="reason_code">固定拒绝原因</label>
      <select id="reason_code" name="reason_code" required>
      {% for code in rejection_codes %}<option value="{{ code }}">{{ code }}</option>{% endfor %}
      </select>
      <label for="note">非敏感备注代码</label>
      <input id="note" name="note" required pattern="[a-z0-9][a-z0-9_-]*" maxlength="200">
      <button class="btn btn-outline" type="submit">拒绝候选</button>
    </form>
  </div>
  {% endif %}
</div>
{% endblock %}

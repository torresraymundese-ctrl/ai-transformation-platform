<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 转型评估报告</title>
  <style>
    @page {
      size: A4;
      margin: 14mm 13mm 18mm;
      @bottom-center {
        content: "AI 转型评估报告 · 第 " counter(page) " 页 / 共 " counter(pages) " 页";
        color: #6e6e73;
        font-size: 8pt;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: #1d1d1f; font: 10pt/1.55 "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    h1 { margin: 0 0 4mm; font-size: 25pt; line-height: 1.15; }
    h2 { margin: 0; font-size: 16pt; break-after: avoid; }
    h3 { margin: 0 0 2mm; font-size: 12pt; break-after: avoid; }
    h4 { margin: 0 0 1mm; font-size: 10pt; break-after: avoid; }
    p { margin: 0 0 2mm; }
    ul, ol { margin: 1.5mm 0 0; padding-left: 5mm; }
    li { margin-bottom: 1mm; }
    .report-page { max-width: none; }
    .report-hero { padding: 12mm; color: #fff; background: #0a3d78; border-radius: 5mm; }
    .report-eyebrow, .report-version, .card-label { letter-spacing: .08em; text-transform: uppercase; }
    .report-summary { display: flex; gap: 12mm; margin-top: 7mm; }
    .report-summary div { min-width: 45mm; padding: 4mm; background: rgba(255,255,255,.12); border-radius: 3mm; }
    .report-summary span, .report-summary small { display: block; }
    .report-summary strong { font-size: 20pt; }
    .report-section { margin-top: 9mm; }
    .report-section-heading { display: flex; gap: 4mm; padding-bottom: 3mm; border-bottom: .4mm solid #d2d2d7; break-after: avoid; break-inside: avoid; }
    .report-section-number { color: #0071e3; font-weight: 700; }
    .score-layout, .diagnosis-grid, .roi-grid, .roadmap-grid { display: flex; gap: 5mm; margin-top: 5mm; }
    .radar-chart { width: 85mm; height: 85mm; }
    .radar-grid, .radar-axis { fill: none; stroke: #d2d2d7; stroke-width: 1; }
    .radar-reference { fill: none; stroke: #bf4800; stroke-width: 2; stroke-dasharray: 5 4; }
    .radar-score { fill: rgba(0,113,227,.18); stroke: #0071e3; stroke-width: 2.5; }
    .radar-chart text { font-size: 10px; }
    .score-table-wrap { flex: 1; }
    table { width: 100%; border-collapse: collapse; }
    caption { margin-bottom: 2mm; font-weight: 700; text-align: left; }
    th, td { padding: 2mm; border-bottom: .3mm solid #e8e8ed; text-align: left; }
    .chart-legend { display: flex; gap: 4mm; margin-top: 2mm; font-size: 8pt; }
    .chart-legend i { display: inline-block; width: 6mm; margin-right: 1mm; border-top: .6mm solid #0071e3; }
    .chart-legend .legend-reference { border-color: #bf4800; border-top-style: dashed; }
    .diagnosis-card, .roi-band, .recommendation-card, .service-package, .calculation-basis { flex: 1; padding: 4mm; border: .3mm solid #d2d2d7; border-radius: 3mm; }
    .recommendation-card { display: flex; gap: 4mm; margin-top: 4mm; }
    .recommendation-rank { color: #0071e3; font-size: 18pt; font-weight: 700; }
    .roi-band dl { margin: 0; }
    .roi-band dl div { display: flex; justify-content: space-between; gap: 3mm; padding: 1.5mm 0; border-bottom: .2mm solid #e8e8ed; }
    .roi-band dd { margin: 0; font-weight: 700; }
    .calculation-basis { margin-top: 4mm; background: #f5f5f7; }
    .roadmap-grid > div { flex: 1; }
    .timeline-list { list-style: none; padding: 0; }
    .timeline-list li, .risk-list li { display: flex; gap: 4mm; padding: 2mm 0; border-bottom: .2mm solid #e8e8ed; }
    .timeline-list strong, .risk-list strong { min-width: 24mm; color: #0071e3; }
    .score-layout, .diagnosis-card, .roi-band, .recommendation-card, .calculation-basis, .roadmap-grid > div, .package-details > section, .risk-list li { break-inside: avoid; }
    .service-package { margin-top: 4mm; break-inside: avoid; }
    .service-package header { break-after: avoid; break-inside: avoid; }
    .package-details { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 6mm; margin-top: 4mm; }
    .package-note, .report-disclaimer { padding: 4mm; background: #fef4ee; border-radius: 3mm; }
    .report-disclaimer { margin-top: 9mm; break-inside: avoid; }
  </style>
</head>
<body>
<main class="report-page" data-snapshot-sha256="{{ snapshot_digest }}">
{% include "assessment/_report_content.html" %}
</main>
</body>
</html>
